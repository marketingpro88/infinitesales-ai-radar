name: Analyze Posts

on:
  workflow_run:
    workflows: ["Transcribe Videos"]
    types: [completed]
  workflow_dispatch:
    inputs:
      post_limit:
        default: "60"

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      models: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analyze new posts (free GitHub Models)
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_LIMIT: ${{ inputs.post_limit || '60' }}
        run: python analyze_posts.py
